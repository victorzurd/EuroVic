<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EuroVic — Control de Gastos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0d0f17;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(22, 27, 38, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen pb-12">
  <div class="max-w-md mx-auto px-4 pt-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white">EuroVic <span class="text-emerald-400">✨</span></h1>
        <p class="text-xs text-gray-400 mt-0.5">Control inteligente de tus gastos</p>
      </div>
      <button onclick="cargarGastos()" class="p-2 rounded-xl bg-gray-800 border border-gray-700 text-gray-300 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      </button>
    </div>

    <!-- Alert / Toast -->
    <div id="statusToast" class="hidden mb-4 p-3 rounded-xl text-sm font-medium border text-center"></div>

    <!-- Card Resumen Mensual -->
    <div class="glass-card rounded-2xl p-5 mb-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Resumen mensual</span>
        <input type="month" id="monthFilter" onchange="cargarGastos()" class="bg-gray-800 text-xs font-medium text-white px-3 py-1.5 rounded-lg border border-gray-700 focus:outline-none focus:border-emerald-500">
      </div>

      <div class="flex items-baseline space-x-2">
        <span id="totalMonto" class="text-4xl font-extrabold text-white">0,00 €</span>
      </div>
      
      <div class="mt-4 pt-4 border-t border-gray-800 flex justify-between text-xs text-gray-400">
        <div>
          <span>Transacciones:</span>
          <span id="totalCount" class="font-semibold text-gray-200 ml-1">0</span>
        </div>
        <button onclick="borrarMesCompleto()" class="text-red-400 hover:text-red-300 transition font-medium">Borrar este mes</button>
      </div>
    </div>

    <!-- Formulario Gasto Manual -->
    <div class="glass-card rounded-2xl p-5 mb-6 shadow-xl">
      <h2 class="text-sm font-bold text-gray-200 mb-3 flex items-center gap-2">
        <span>➕</span> Añadir Gasto Manual
      </h2>
      <form id="gastoForm" onsubmit="guardarGastoManual(event)" class="space-y-3">
        <div class="grid grid-cols-3 gap-2">
          <input type="text" id="comercio" placeholder="Comercio (ej. Zara)" required class="col-span-2 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          <input type="number" step="0.01" id="monto" placeholder="0.00 €" required class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <select id="categoria" class="col-span-2 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Self Care">💅 Self Care</option>
            <option value="Brunch & Desayunos">🥐 Brunch & Desayunos</option>
            <option value="Cenas & Copas">🍷 Cenas & Copas</option>
            <option value="Fiesta & Eventos">🎉 Fiesta & Eventos</option>
            <option value="Supermercado">🛒 Supermercado</option>
            <option value="Escapadas">✈️ Escapadas</option>
            <option value="Movilidad">🚗 Movilidad</option>
            <option value="Varios" selected>✨ Varios</option>
          </select>
          <input type="text" id="emoji" placeholder="Emoji" value="✨" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-center text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-2.5 rounded-xl transition text-sm">
          Guardar Gasto
        </button>
      </form>
    </div>

    <!-- Lista de Gastos -->
    <div>
      <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-1">Historial de Transacciones</h2>
      <div id="listaGastos" class="space-y-2.5"></div>
    </div>

  </div>

  <script>
    let todosLosGastos = [];

    const hoy = new Date();
    const mesActualStr = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
    document.getElementById('monthFilter').value = mesActualStr;

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const notificacionText = urlParams.get('notificacion');

      if (notificacionText) {
        mostrarToast('Procesando gasto con IA...', 'info');
        try {
          const res = await fetch('/api/webhook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: notificacionText })
          });
          const data = await res.json();
          if (res.ok) {
            mostrarToast(data.mensaje || 'Gasto registrado correctamente', 'success');
            window.history.replaceState({}, document.title, window.location.pathname);
          } else {
            mostrarToast(data.error || 'Error procesando notificación', 'error');
          }
        } catch (e) {
          mostrarToast('Error al conectar con el servidor', 'error');
        }
      }

      await cargarGastos();
    });

    async function cargarGastos() {
      try {
        const res = await fetch('/api/gastos');
        if (!res.ok) throw new Error('Error al obtener gastos');
        todosLosGastos = await res.json();
        renderizar();
      } catch (e) {
        mostrarToast('No se pudieron cargar los gastos', 'error');
      }
    }

    function renderizar() {
      const mesSeleccionado = document.getElementById('monthFilter').value;
      const listaEl = document.getElementById('listaGastos');
      listaEl.innerHTML = '';

      const filtrados = todosLosGastos.filter(g => {
        if (!g.fecha) return false;
        const f = new Date(g.fecha);
        const yyyymm = `${f.getFullYear()}-${String(f.getMonth() + 1).padStart(2, '0')}`;
        return yyyymm === mesSeleccionado;
      });

      let total = 0;
      filtrados.forEach(g => { total += parseFloat(g.monto || 0); });

      document.getElementById('totalMonto').innerText = total.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
      document.getElementById('totalCount').innerText = filtrados.length;

      if (filtrados.length === 0) {
        listaEl.innerHTML = `
          <div class="glass-card rounded-2xl p-6 text-center text-gray-400 text-sm">
            No hay gastos registrados para este mes. 🌴
          </div>
        `;
        return;
      }

      filtrados.forEach(g => {
        const dateObj = new Date(g.fecha);
        const fechaFormat = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl p-3.5 flex justify-between items-center hover:bg-gray-800/50 transition';
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gray-800 flex items-center justify-center text-xl border border-gray-700">
              ${g.emoji || '✨'}
            </div>
            <div>
              <div class="font-bold text-sm text-gray-100">${escapeHtml(g.comercio)}</div>
              <div class="text-xs text-gray-400 space-x-1">
                <span>${fechaFormat}</span>
                <span>•</span>
                <span class="text-emerald-400">${escapeHtml(g.categoria || 'Varios')}</span>
              </div>
            </div>
          </div>
          <div class="flex items-center space-x-3">
            <span class="font-bold text-sm text-red-400">-${parseFloat(g.monto).toFixed(2)} €</span>
            <button onclick="borrarGasto(${g.id})" class="text-gray-500 hover:text-red-400 transition p-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        `;
        listaEl.appendChild(card);
      });
    }

    async function guardarGastoManual(e) {
      e.preventDefault();
      const comercio = document.getElementById('comercio').value;
      const monto = document.getElementById('monto').value;
      const categoria = document.getElementById('categoria').value;
      const emoji = document.getElementById('emoji').value;

      try {
        const res = await fetch('/api/gastos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comercio, monto, categoria, emoji })
        });

        if (res.ok) {
          mostrarToast('Gasto añadido correctamente', 'success');
          document.getElementById('gastoForm').reset();
          document.getElementById('emoji').value = '✨';
          await cargarGastos();
        } else {
          mostrarToast('Error al guardar el gasto', 'error');
        }
      } catch (err) {
        mostrarToast('Error de conexión', 'error');
      }
    }

    async function borrarGasto(id) {
      if (!confirm('¿Quieres eliminar esta transacción?')) return;
      try {
        const res = await fetch(`/api/gastos?id=${id}`, { method: 'DELETE' });
        if (res.ok) {
          mostrarToast('Transacción eliminada', 'success');
          await cargarGastos();
        }
      } catch (e) {
        mostrarToast('Error al eliminar', 'error');
      }
    }

    async function borrarMesCompleto() {
      const mes = document.getElementById('monthFilter').value;
      if (!confirm(`¿Estás seguro de BORRAR TODOS los gastos de ${mes}?`)) return;
      try {
        const res = await fetch(`/api/gastos?month=${mes}`, { method: 'DELETE' });
        if (res.ok) {
          mostrarToast(`Gastos de ${mes} eliminados`, 'success');
          await cargarGastos();
        }
      } catch (e) {
        mostrarToast('Error al eliminar mes', 'error');
      }
    }

    function mostrarToast(msg, tipo) {
      const toast = document.getElementById('statusToast');
      toast.innerText = msg;
      toast.className = `mb-4 p-3 rounded-xl text-sm font-medium border text-center transition ${
        tipo === 'success' ? 'bg-emerald-950/80 border-emerald-700 text-emerald-200' :
        tipo === 'error' ? 'bg-red-950/80 border-red-700 text-red-200' :
        'bg-blue-950/80 border-blue-700 text-blue-200'
      }`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }
  </script>
</body>
</html>
