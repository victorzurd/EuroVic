<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eurovic ✨</title>
  <!-- Metatags para que funcione como App de iOS (PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eurovic">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      background-color: #FAF5F0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
    }
  </style>
</head>
<body class="p-6 text-pink-950 max-w-md mx-auto pb-12">

  <!-- Header -->
  <div class="flex justify-between items-center my-4">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight text-pink-900">Eurovic ✨</h1>
      <p class="text-xs text-pink-400 font-medium">Your daily aesthetics & expenses</p>
    </div>
    <div class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-lg border border-pink-200 shadow-sm">
      👑
    </div>
  </div>

  <!-- Main Balance Card -->
  <div class="bg-gradient-to-br from-pink-200 via-pink-100 to-amber-50 rounded-3xl p-6 shadow-sm border border-pink-200/50 mb-6 text-center">
    <span class="text-xs font-semibold tracking-wider uppercase text-pink-500">Gastado este mes</span>
    <div id="total-amount" class="text-4xl font-extrabold text-pink-950 my-2">0,00 €</div>
    <div class="inline-block bg-white/70 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-pink-700 shadow-sm">
      💅 Todo bajo control, queen
    </div>
  </div>

  <!-- Categories Grid -->
  <h2 class="text-xs font-bold uppercase tracking-wider text-pink-400 mb-3">Categorías top</h2>
  <div class="grid grid-cols-2 gap-3 mb-6">
    <div class="bg-white/80 p-4 rounded-2xl border border-pink-100 shadow-sm flex items-center gap-3">
      <span class="text-2xl">🛍️</span>
      <div>
        <p class="text-xs text-pink-400 font-medium">Shopping</p>
        <p id="cat-shopping" class="text-sm font-bold text-pink-900">0,00 €</p>
      </div>
    </div>
    <div class="bg-white/80 p-4 rounded-2xl border border-pink-100 shadow-sm flex items-center gap-3">
      <span class="text-2xl">☕</span>
      <div>
        <p class="text-xs text-pink-400 font-medium">Brunch & Coffee</p>
        <p id="cat-coffee" class="text-sm font-bold text-pink-900">0,00 €</p>
      </div>
    </div>
  </div>

  <!-- Recent Transactions List -->
  <div class="flex justify-between items-center mb-3">
    <h2 class="text-xs font-bold uppercase tracking-wider text-pink-400">Últimos caprichos</h2>
    <button onclick="borrarTodo()" class="text-[10px] text-pink-300 underline">Limpiar</button>
  </div>
  
  <div id="expenses-list" class="space-y-3">
    <!-- Se llena dinámicamente -->
  </div>

  <script>
    function obtenerGastos() {
      return JSON.parse(localStorage.getItem('eurovic_gastos') || '[]');
    }

    function render() {
      const gastos = obtenerGastos();
      const total = gastos.reduce((acc, g) => acc + g.monto, 0);
      document.getElementById('total-amount').innerText = total.toFixed(2).replace('.', ',') + ' €';

      // Totales por categoría
      const totalShopping = gastos.filter(g => g.categoria === 'Shopping').reduce((acc, g) => acc + g.monto, 0);
      const totalCoffee = gastos.filter(g => g.categoria === 'Coffee & Brunch' || g.categoria === 'Brunch & Coffee').reduce((acc, g) => acc + g.monto, 0);
      
      document.getElementById('cat-shopping').innerText = totalShopping.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('cat-coffee').innerText = totalCoffee.toFixed(2).replace('.', ',') + ' €';

      const listHtml = gastos.map(g => `
        <div class="bg-white p-4 rounded-2xl border border-pink-50 shadow-sm flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-pink-50 flex items-center justify-center text-xl">${g.emoji || '✨'}</div>
            <div>
              <p class="font-bold text-sm text-pink-950">${g.comercio}</p>
              <p class="text-[10px] text-pink-400">${g.fecha}</p>
            </div>
          </div>
          <span class="font-bold text-sm text-pink-900">-${g.monto.toFixed(2).replace('.', ',')} €</span>
        </div>
      `).join('');

      document.getElementById('expenses-list').innerHTML = listHtml || '<p class="text-xs text-pink-300 text-center py-6">Aún no hay compras guardadas ✨</p>';
    }

    function borrarTodo() {
      if (confirm("¿Quieres borrar el historial de gastos?")) {
        localStorage.removeItem('eurovic_gastos');
        render();
      }
    }

    // Comprobar si llega un gasto enviado desde el Atajo del iPhone
    const urlParams = new URLSearchParams(window.location.search);
    const nuevoGastoParam = urlParams.get('nuevo_gasto');
    if (nuevoGastoParam) {
      try {
        const gasto = JSON.parse(decodeURIComponent(nuevoGastoParam));
        const gastos = obtenerGastos();
        gastos.unshift(gasto);
        localStorage.setItem('eurovic_gastos', JSON.stringify(gastos));
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch(e) {
        console.error("Error al guardar el gasto:", e);
      }
    }

    render();
  </script>
</body>
</html>
